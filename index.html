<p><b>Rodel-Mobility</b> ist jetzt ein Bereich in <a href="../trainingsblog/#mobility">Training</a>.<br>Deine Daten sind dort schon vorhanden.<br><small>Tipp: Training als App installieren und dieses alte Symbol vom Startbildschirm entfernen.</small></p>
<script>
// Alten Offline-Speicher dieser Adresse abmelden, damit nicht weiter die alte Version erscheint
if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(function (rs) {
  rs.forEach(function (r) { if (r.scope.indexOf("/Rodeln/") > -1) r.unregister(); });
}).catch(function () {});
