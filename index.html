<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EAF0F2">
<meta name="description" content="Mobility-Training für Rennrodler: Tagestraining, Wettkampfprogramm, animierte Übungen.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>html{padding-top:env(safe-area-inset-top,0px)}img{max-width:100%}</style>
<title>Rodel-Mobility</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EAF0F2; --surface:#FFFFFF; --surface2:#F3F7F8; --ink:#0E1B24; --muted:#56666F; --line:#D3DDE2;
  --accent:#C8283A; --accent-ink:#FFFFFF; --accent-soft:#F7DDE0;
  --r-back:#1B6C8A; --r-hip:#A15A17; --r-leg:#3B7437; --r-warm:#6A7680; --r-start:#6A4C9C;
  --far:#A7B6BE; --floor:#B9C8CF; --mat:#DCE6EA;
  --shadow:0 1px 2px rgba(14,27,36,.06),0 8px 24px rgba(14,27,36,.06);
  --fd:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --fb:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#091218; --surface:#101D25; --surface2:#15252F; --ink:#E3ECF0; --muted:#8CA0AB; --line:#223540;
    --accent:#F2515F; --accent-ink:#1A0508; --accent-soft:#3A1A20;
    --r-back:#5DB3D3; --r-hip:#E1A061; --r-leg:#8CC47F; --r-warm:#9AA7B0; --r-start:#B7A0DE;
    --far:#48606D; --floor:#2C4350; --mat:#15262F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#091218; --surface:#101D25; --surface2:#15252F; --ink:#E3ECF0; --muted:#8CA0AB; --line:#223540;
  --accent:#F2515F; --accent-ink:#1A0508; --accent-soft:#3A1A20;
  --r-back:#5DB3D3; --r-hip:#E1A061; --r-leg:#8CC47F; --r-warm:#9AA7B0; --r-start:#B7A0DE;
  --far:#48606D; --floor:#2C4350; --mat:#15262F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 6px}
.brand{white-space:nowrap;font-family:var(--fd);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:14px}
.today{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font-family:var(--fd);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.view{display:flex;flex-direction:column;gap:18px;padding-top:8px}

/* Heute */
.hero{background:var(--surface);border-radius:18px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.rot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rot button{border:1.5px solid var(--line);background:var(--surface2);border-radius:12px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:0}
.rot b{font-family:var(--fd);font-size:26px;line-height:1;font-weight:700}
.rot span{font-size:12px;color:var(--muted)}
.rot button.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.rot button.on span{color:inherit;opacity:.75}
.rot button .done{font-size:11px}
.blk{font-family:var(--fd);font-weight:700;font-size:40px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.meta{margin:0;color:var(--muted);font-size:14px}
.seg{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg .lbl{font-size:13px;color:var(--muted)}
.seg .opts{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg .opts button{border:0;background:transparent;border-radius:7px;padding:5px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.seg .opts button.on{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.start{white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);padding:16px;font-family:var(--fd);font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.start svg{width:18px;height:18px}
.start small{font-family:var(--fb);font-weight:500;font-size:14px;letter-spacing:0;text-transform:none;opacity:.85;font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:14px;padding:8px 10px 8px 8px;border:1px solid var(--line)}
.row .th{width:64px;height:64px;border-radius:10px;background:var(--surface2);display:block}
.row .nm{font-weight:600;line-height:1.2}
.row .sub{font-size:13px;color:var(--muted);line-height:1.3;margin-top:2px}
.row .main{border:0;background:none;text-align:left;padding:0;min-width:0}
.row .right{display:flex;align-items:center;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.ibtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center}
.ibtn svg{width:18px;height:18px}
.note{font-size:14px;color:var(--muted);background:var(--surface2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.note b{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--fd);font-weight:700;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}

/* Wettkampf */
.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs2 button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left}
.tabs2 button b{display:block;font-family:var(--fd);font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.tabs2 button span{font-size:13px;color:var(--muted)}
.tabs2 button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.phase{display:flex;flex-direction:column;gap:8px}
.phase h3{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--fd);font-weight:600;font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.phase h3 span{font-family:var(--fb);font-weight:500;font-size:13px;letter-spacing:0;text-transform:none;color:var(--muted);font-variant-numeric:tabular-nums}
.warn{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:12px;padding:12px;font-size:14px}
.warn svg{flex:none;width:20px;height:20px;color:var(--accent);margin-top:1px}

/* Übungen */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;padding:12px 0;min-width:0}
.search input:focus{outline:none}
.search:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grp{font-family:var(--fd);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;margin-top:4px}

/* Fortschritt */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font-family:var(--fd);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.card p{margin:0;font-size:14px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .d{aspect-ratio:1;max-width:100%;border-radius:6px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.cal .d.has{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.cal .d.comp{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .h{font-size:11px;color:var(--muted);text-align:center;font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
form.test{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
form.test label{flex:1 1 180px;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
form.test input{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-variant-numeric:tabular-nums}
form.test button{align-self:flex-end;border:0;background:var(--ink);color:var(--bg);border-radius:10px;padding:11px 16px;font-weight:600}
.chart{width:100%;height:auto;display:block}
.entries{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.entries li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.entries li:last-child{border-bottom:0}
.entries button{border:0;background:none;color:var(--muted);font-size:13px;padding:4px 6px}
.entries button.really{color:var(--accent);font-weight:600}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set span{font-size:15px}
.set small{display:block;color:var(--muted);font-size:13px}
.tog{width:48px;height:28px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .18s}
.tog[aria-pressed="true"]{background:var(--accent)}
.tog[aria-pressed="true"]::after{transform:translateX(20px)}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabbar .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);font-weight:500}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--ink);font-weight:600}
.tabbar button.on svg{color:var(--accent)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(5,12,16,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:94%;overflow:auto;border-radius:20px 20px 0 0;padding-inline:16px;padding-block:0 calc(24px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.sheet .grab{position:sticky;top:0;background:var(--bg);z-index:2;display:flex;justify-content:space-between;align-items:center;padding-block:12px 8px;gap:10px}
.sheet h2{font-family:var(--fd);font-weight:700;font-size:30px;line-height:1.02;text-transform:uppercase}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.stage{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.stage canvas{display:block;width:100%;height:260px}
.stage .bar{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px;border-top:1px solid var(--line);flex-wrap:wrap}
.play{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;font-weight:600}
.play svg{width:16px;height:16px}
.speed{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.ext{font-size:14px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.stage .cap{position:absolute;left:10px;top:10px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sec{display:flex;flex-direction:column;gap:6px;margin-top:18px}
.sec h3{font-family:var(--fd);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sec p{margin:0;max-width:65ch}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);font-family:var(--fd);font-weight:700;font-size:16px;width:28px;height:28px;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.musc{display:flex;flex-wrap:wrap;gap:6px}
.musc .chip.p{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.bul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.mini b{display:block;font-family:var(--fd);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--muted);margin-bottom:2px}
.sled{background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;font-size:15px}
.sled b{font-family:var(--fd);letter-spacing:.08em;text-transform:uppercase;font-size:13px;display:block;opacity:.7}

/* Player */
.player{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.player .ph{display:flex;align-items:center;gap:10px;padding:12px 16px 8px;max-width:620px;width:100%;margin:0 auto}
.prog{flex:1;display:flex;gap:3px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.prog i b{position:absolute;inset:0;background:var(--ink);transform-origin:left;transform:scaleX(0)}
.player .body{flex:1;display:flex;flex-direction:column;max-width:620px;width:100%;margin:0 auto;padding-inline:16px;min-height:0;gap:10px}
.pstage{flex:1;min-height:160px;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.pstage canvas{position:absolute;inset:0;width:100%;height:100%}
.side{position:absolute;top:12px;left:12px;font-family:var(--fd);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:15px;background:var(--ink);color:var(--bg);padding:4px 10px;border-radius:8px}
.flash{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 88%,transparent);color:var(--accent-ink);font-family:var(--fd);font-weight:700;font-size:40px;text-transform:uppercase;letter-spacing:.04em;text-align:center}
.pinfo{display:flex;flex-direction:column;gap:2px}
.pinfo .k{font-family:var(--fd);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.pinfo h2{font-family:var(--fd);font-weight:700;font-size:32px;line-height:1;text-transform:uppercase}
.pinfo p{margin:2px 0 0;color:var(--muted);font-size:15px}
.clock{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.clock .t{font-family:var(--fd);font-weight:700;font-size:84px;line-height:.85;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.clock .t.prep{color:var(--muted)}
.clock .nx{font-size:13px;color:var(--muted);text-align:right;max-width:48%}
.clock .nx b{display:block;color:var(--ink);font-size:15px}
.tbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.tbar b{display:block;height:100%;background:var(--accent);transform-origin:left;transform:scaleX(0)}
.ctrl{display:flex;justify-content:center;align-items:center;gap:22px;padding-block:6px 14px}
.ctrl button{border:1px solid var(--line);background:var(--surface);width:56px;height:56px;border-radius:50%;display:grid;place-items:center}
.ctrl button svg{width:22px;height:22px}
.ctrl .big{width:76px;height:76px;background:var(--ink);color:var(--bg);border:0}
.ctrl .big svg{width:28px;height:28px}
.fin{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:left}
.fin h2{font-family:var(--fd);font-weight:700;font-size:54px;line-height:.95;text-transform:uppercase}
.fin p{margin:0;color:var(--muted);font-size:16px;max-width:40ch}
.xbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.xbtn svg{width:18px;height:18px}
@media (max-width:380px){.blk{font-size:34px}.rot b{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Android / 16:9 */
html{-webkit-tap-highlight-color:transparent}
body{margin:0;overscroll-behavior-y:contain}
button{touch-action:manipulation}
.ibtn{width:44px;height:44px}
.hdr-r{display:flex;align-items:center;gap:10px;min-width:0;flex:1;justify-content:flex-end}
.gear{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.gear svg{width:20px;height:20px}
.install{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px}
.install div{flex:1;font-size:14px;line-height:1.3}
.install b{display:block;font-size:15px}
.install button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 14px;font-weight:600;white-space:nowrap}
.install .no{background:none;color:inherit;opacity:.7;padding:10px 4px}
.plan{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.plan label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.plan input{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;padding:9px 10px;font:inherit;font-variant-numeric:tabular-nums;min-height:44px}
.plan .out{flex:1 1 170px;font-size:14px;color:var(--muted);line-height:1.35}
.plan .out b{display:block;font-family:var(--fd);font-weight:700;font-size:30px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.set .opts{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex:none}

/* =========================================================
   Kinematik + Rendering
   ========================================================= */
function fk(p,ex){
  const s=k=>(p.sc&&p.sc[k]!=null)?p.sc[k]:1;
  const P={};P.hip=[0,0];
  const hw=(p.hipW||0)/2, ph=pv(p.lumb);
  P.hipN=ad(P.hip,ph,hw);P.hipF=ad(P.hip,ph,-hw);
  P.mid=ad(P.hip,dv(p.lumb),L.lumb*s('lumb'));
  P.sh=ad(P.mid,dv(p.thor),L.thor*s('thor'));
  const sw=(p.shW||0)/2, ps=pv(p.thor);
  P.shN=ad(P.sh,ps,sw);P.shF=ad(P.sh,ps,-sw);
  if(p.view==='side'){P.hipF=[P.hipF[0]-2.5,P.hipF[1]-1.5];P.shF=[P.shF[0]-2.5,P.shF[1]-1.5];}
  P.neck=ad(P.sh,dv(p.head),L.neck*s('head'));
  P.headC=ad(P.neck,dv(p.head),L.head*s('head'));
  for(const n of ['N','F']){
    P['elbow'+n]=ad(P['sh'+n],dv(p['arm'+n]),L.arm*s('arm'+n));
    P['hand'+n]=ad(P['elbow'+n],dv(p['fore'+n]),L.fore*s('fore'+n));
    P['knee'+n]=ad(P['hip'+n],dv(p['thigh'+n]),L.thigh*s('thigh'+n));
    P['ankle'+n]=ad(P['knee'+n],dv(p['shin'+n]),L.shin*s('shin'+n));
    P['toe'+n]=ad(P['ankle'+n],dv(p['foot'+n]),L.foot*s('foot'+n));
  }
  const props=(ex&&ex.anim.props)||[];
  for(const pr of props){
    if(pr.t==='roller'){P.rollC=[P.mid[0],P.mid[1]+11];P.rollB=[P.mid[0],P.mid[1]+18];}
    if(pr.t==='sled'){P.sledB=[P.hip[0],P.hip[1]+16];}
  }
  return P;
}
function groundPts(P,p){
  const out=[];
  for(const k in P){if(k==='headC'||k==='rollC')continue;out.push(P[k]);}
  out.push([P.headC[0],P.headC[1]+L.head]);
  return out;
}
function place(ex,p){
  const P=fk(p,ex);
  let dx=0,dy=0;
  if(p.view!=='top'){let my=-1e9;for(const q of groundPts(P,p))my=Math.max(my,q[1]);dy=-my;}
  const a=ex.anim.anchor;
  if(a&&ex._ref){dx=ex._ref[0]-P[a][0];if(p.view==='top')dy=ex._ref[1]-P[a][1];}
  for(const k in P){P[k]=[P[k][0]+dx,P[k][1]+dy];}
  return P;
}
const ease=u=>.5-.5*Math.cos(Math.PI*u);
function lerpPose(a,b,u){
  const o={view:b.view,sc:{}};
  for(const k of AK){const x=a[k]||0,y=b[k]||0;o[k]=x+(y-x)*u;}
  for(const k of SK){const x=(a.sc&&a.sc[k]!=null)?a.sc[k]:1,y=(b.sc&&b.sc[k]!=null)?b.sc[k]:1;o.sc[k]=x+(y-x)*u;}
  return o;
}
function prep(ex){
  if(ex._fr)return;
  const A=ex.anim, base=B[A.base];
  let fr=A.frames.map(f=>{const p=Object.assign({},base,f);p.sc=Object.assign({},base.sc||{},f.sc||{});p.d=f.d!=null?f.d:1.2;p.h=f.h!=null?f.h:.6;return p;});
  if(A.pingpong)fr=fr.concat(fr.slice(1,-1).reverse().map(p=>Object.assign({},p)));
  ex._fr=fr;ex._T=fr.reduce((s,p)=>s+p.d+p.h,0);
  ex._ref=null;
  if(A.anchor){const P0=place(ex,fr[0]);ex._ref=P0[A.anchor];}
  const wall=(A.props||[]).find(x=>x.t==='wall');
  if(wall){const Pw=place(ex,fr[wall.f||0]);ex._wallX=Pw.handN[0]+3;}
  // Bounding box
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  const N=72;
  for(let i=0;i<N;i++){
    const p=poseAt(ex,ex._T*i/N);const P=place(ex,p);
    for(const k in P){const q=P[k];const r=(k==='headC')?L.head:(k==='rollC'?7:0);x0=Math.min(x0,q[0]-r);x1=Math.max(x1,q[0]+r);y0=Math.min(y0,q[1]-r);y1=Math.max(y1,q[1]+r);}
  }
  if(ex._wallX!=null){x1=Math.max(x1,ex._wallX+4);y0=Math.min(y0,-120);}
  if(ex._fr[0].view!=='top')y1=Math.max(y1,0);
  ex._bb={x0,x1,y0,y1};
}
function poseAt(ex,t){
  const fr=ex._fr;const T=ex._T;t=((t%T)+T)%T;
  let acc=0;
  for(let i=0;i<fr.length;i++){
    const f=fr[i];
    if(t<acc+f.d){const prev=fr[(i-1+fr.length)%fr.length];return lerpPose(prev,f,ease((t-acc)/f.d));}
    acc+=f.d;
    if(t<acc+f.h)return lerpPose(f,f,0);
    acc+=f.h;
  }
  return lerpPose(fr[0],fr[0],0);
}

let COL={};
function readColors(){
  const cs=getComputedStyle(document.documentElement);
  const g=n=>cs.getPropertyValue(n).trim();
  COL={ink:g('--ink'),far:g('--far'),hl:g('--accent'),floor:g('--floor'),mat:g('--mat'),muted:g('--muted'),surface:g('--surface'),hip:g('--r-hip'),prop:g('--r-hip'),line:g('--line')};
}
readColors();

function drawFigure(cv,ex,t,opts={}){
  prep(ex);
  const dpr=Math.min(window.devicePixelRatio||1,2.5);
  const W=cv.clientWidth,H=cv.clientHeight;
  if(!W||!H)return;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
  const c=cv.getContext('2d');
  c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,W,H);
  const p=poseAt(ex,t);const P=place(ex,p);
  const bb=ex._bb;const pad=opts.pad!=null?opts.pad:Math.max(10,Math.min(W,H)*.08);
  const bw=bb.x1-bb.x0,bh=bb.y1-bb.y0;
  let s=Math.min((W-2*pad)/bw,(H-2*pad)/bh);
  const ox=W/2-(bb.x0+bb.x1)/2*s, oy=H/2-(bb.y0+bb.y1)/2*s;
  c.save();
  if(opts.mirror){c.translate(W,0);c.scale(-1,1);}
  c.translate(ox,oy);c.scale(s,s);
  c.lineCap='round';c.lineJoin='round';
  const lw=1/s;
  // Boden / Matte
  if(p.view==='top'){
    c.fillStyle=COL.mat;const m=8;
    roundRect(c,bb.x0-m,bb.y0-m,bw+2*m,bh+2*m,10);c.fill();
  }else{
    c.strokeStyle=COL.floor;c.lineWidth=2*lw;
    c.beginPath();c.moveTo((-ox)/s,0);c.lineTo((W-ox)/s,0);c.stroke();
    c.lineWidth=1*lw;
    for(let x=Math.floor((-ox)/s/14)*14;x<(W-ox)/s;x+=14){c.beginPath();c.moveTo(x,0);c.lineTo(x-6,7);c.stroke();}
  }
  const props=ex.anim.props||[];
  // Requisiten hinten
  for(const pr of props){
    if(pr.t==='wall'){c.fillStyle=COL.floor;c.fillRect(ex._wallX,bb.y0-10,6,-bb.y0+10);}
    if(pr.t==='roller'){c.fillStyle=COL.prop;c.globalAlpha=.85;c.beginPath();c.arc(P.rollC[0],P.rollC[1],7,0,Math.PI*2);c.fill();c.globalAlpha=1;}
    if(pr.t==='sled'){
      c.fillStyle=COL.floor;c.strokeStyle=COL.muted;c.lineWidth=2*lw;
      const x0=P.hip[0]-14,x1=P.toeN[0]+6,y=P.hip[1]+4;
      roundRect(c,x0,y,x1-x0,6,3);c.fill();
      c.beginPath();c.moveTo(x0+4,y+6);c.lineTo(x0+4,y+12);c.moveTo(x1-10,y+6);c.lineTo(x1-10,y+12);c.stroke();
      c.lineWidth=2.5*lw;c.beginPath();c.moveTo(x0-4,y+12);c.lineTo(x1+2,y+12);c.quadraticCurveTo(x1+10,y+12,x1+10,y+4);c.stroke();
    }
    if(pr.t==='wedge'){c.fillStyle=COL.prop;c.globalAlpha=.8;const tx=P.toeN[0];c.beginPath();c.moveTo(tx-16,0);c.lineTo(tx+4,0);c.lineTo(tx+4,P.toeN[1]+1.5);c.closePath();c.fill();c.globalAlpha=1;}
  }
  const hl=new Set(ex.anim.hl||[]);
  const seg=(a,b,w,col)=>{c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(P[a][0],P[a][1]);c.lineTo(P[b][0],P[b][1]);c.stroke();};
  const limb=(n,col,alpha)=>{
    c.globalAlpha=alpha;
    const hc=hl=>COL.hl;
    seg('hip'+n,'knee'+n,7,hl.has('thigh'+n)?COL.hl:col);
    seg('knee'+n,'ankle'+n,6.2,hl.has('shin'+n)?COL.hl:col);
    seg('ankle'+n,'toe'+n,5,col);
    c.globalAlpha=1;
  };
  const arm=(n,col,alpha)=>{
    c.globalAlpha=alpha;
    seg('sh'+n,'elbow'+n,6,hl.has('arm'+n)?COL.hl:col);
    seg('elbow'+n,'hand'+n,5.2,col);
    c.globalAlpha=1;
  };
  const side=p.view==='side';
  const farCol=side?COL.far:COL.ink;
  const farA=side?1:.92;
  arm('F',farCol,farA);limb('F',farCol,farA);
  // Rumpf
  if(side){
    c.strokeStyle=COL.ink;c.lineWidth=11;
    c.beginPath();c.moveTo(P.hip[0],P.hip[1]);c.quadraticCurveTo(P.mid[0],P.mid[1],P.sh[0],P.sh[1]);c.stroke();
    if(hl.has('lumb')||hl.has('thor')){
      c.strokeStyle=COL.hl;c.lineWidth=5;c.beginPath();
      const m=[(P.hip[0]+P.mid[0])/2,(P.hip[1]+P.mid[1])/2],n=[(P.mid[0]+P.sh[0])/2,(P.mid[1]+P.sh[1])/2];
      if(hl.has('lumb')&&hl.has('thor')){c.moveTo(P.hip[0],P.hip[1]);c.quadraticCurveTo(P.mid[0],P.mid[1],P.sh[0],P.sh[1]);}
      else if(hl.has('lumb')){c.moveTo(P.hip[0],P.hip[1]);c.quadraticCurveTo(m[0],m[1],P.mid[0],P.mid[1]);}
      else{c.moveTo(P.mid[0],P.mid[1]);c.quadraticCurveTo(n[0],n[1],P.sh[0],P.sh[1]);}
      c.stroke();
    }
  }else{
    seg('hipF','hipN',9,COL.ink);
    seg('hip','mid',9,hl.has('lumb')?COL.hl:COL.ink);
    seg('mid','sh',9,hl.has('thor')?COL.hl:COL.ink);
    seg('shF','shN',8,hl.has('thor')?COL.hl:COL.ink);
  }
  seg('sh','neck',5,COL.ink);
  c.fillStyle=COL.ink;c.beginPath();c.arc(P.headC[0],P.headC[1],L.head*(p.view==='top'?.9:1),0,Math.PI*2);c.fill();
  // Gelenk-Markierungen (Zielzone)
  for(const k of ['hip','hipN','hipF']){
    if(hl.has(k)){c.fillStyle=COL.hl;c.globalAlpha=.9;c.beginPath();c.arc(P[k][0],P[k][1],6.5,0,Math.PI*2);c.fill();c.globalAlpha=1;}
  }
  limb('N',COL.ink,1);arm('N',COL.ink,1);
  // Requisiten vorn
  for(const pr of props){
    if(pr.t==='strap'){c.strokeStyle=COL.prop;c.lineWidth=2.2;c.setLineDash([4,3]);c.beginPath();c.moveTo(P.handN[0],P.handN[1]);c.lineTo((P.toeN[0]+P.ankleN[0])/2,(P.toeN[1]+P.ankleN[1])/2);c.stroke();c.setLineDash([]);}
    if(pr.t==='stick'){
      const d=[P.sh[0]-P.hip[0],P.sh[1]-P.hip[1]];const l=Math.hypot(d[0],d[1]);const u=[d[0]/l,d[1]/l];const bk=[u[1],-u[0]];
      const a=[P.hip[0]-u[0]*10+bk[0]*6.5,P.hip[1]-u[1]*10+bk[1]*6.5];
      const b=[P.headC[0]+u[0]*12+bk[0]*(L.head+1.5),P.headC[1]+u[1]*12+bk[1]*(L.head+1.5)];
      c.strokeStyle=COL.prop;c.lineWidth=3;c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke();
    }
  }
  c.restore();
}
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function thumbT(ex){prep(ex);let acc=0;const i=Math.min(ex.anim.th||0,ex._fr.length-1);for(let k=0;k<=i;k++){acc+=ex._fr[k].d;if(k<i)acc+=ex._fr[k].h;}return acc+.01;}

/* Animations-Schleife */
const live=new Map();
let rafOn=false;
function loop(now){
  for(const [cv,a] of live){
    if(!cv.isConnected){live.delete(cv);continue;}
    if(a.playing){a.t+=(now-(a.last||now))/1000*a.speed;}
    a.last=now;
    drawFigure(cv,EXM[a.id],a.t,{mirror:a.mirror});
  }
  if(live.size)requestAnimationFrame(loop);else rafOn=false;
}
function animate(cv,id,o={}){
  live.set(cv,Object.assign({id,t:o.t!=null?o.t:0,speed:1,playing:true,last:0,mirror:false},o));
  if(!rafOn){rafOn=true;requestAnimationFrame(loop);}
  return live.get(cv);
}
function drawThumbs(root=document){
  root.querySelectorAll('canvas[data-thumb]').forEach(cv=>{const ex=EXM[cv.dataset.thumb];drawFigure(cv,ex,thumbT(ex),{pad:5});});
}

function row(item,opts={}){
  const ex=EXM[item.id];
  const t=item.sides?`2 × ${mmss(item.t/2)}`:mmss(item.t);
  return `<li class="row" data-id="${ex.id}">
    <canvas class="th" data-thumb="${ex.id}" aria-hidden="true"></canvas>
    <button class="main" data-open="${ex.id}"><div class="nm">${esc(item.label||ex.name)}</div><div class="sub">${esc(item.note||ex.mp.slice(0,2).join(' · '))}</div></button>
    <div class="right"><span class="chip">${t}</span>${opts.swap!=null?`<button class="ibtn" data-swap="${opts.swap}" aria-label="${esc(ex.name)} tauschen" title="Übung tauschen">${IC.swap}</button>`:''}</div>
  </li>`;
}
function streak(){
  const days=new Set(S.sessions.map(s=>s.date));let n=0;const d=new Date();
  if(!days.has(dkey(d)))d.setDate(d.getDate()-1);
  while(days.has(dkey(d))){n++;d.setDate(d.getDate()-1);}
  return n;
}
function weekCount(){
  const d=new Date();const wd=(d.getDay()+6)%7;const mon=new Date(d.getFullYear(),d.getMonth(),d.getDate()-wd);
  const days=new Set(S.sessions.filter(s=>new Date(s.date+'T12:00')>=mon).map(s=>s.date));return days.size;
}

$('#v-heute').addEventListener('click',e=>{
  const bl=e.target.closest('[data-block]');if(bl){S.next=+bl.dataset.block;save();renderHeute();return;}
  const du=e.target.closest('[data-dur]');if(du){S.dur=+du.dataset.dur;save();renderHeute();return;}
  const sw=e.target.closest('[data-swap]');
  if(sw){
    const i=S.next%3,b=BLOCKS[i];const list=blockEx(i);const j=+sw.dataset.swap;
    const pool=EX.filter(x=>x.reg===b.reg).map(x=>x.id);
    let k=pool.indexOf(list[j]);
    for(let n=0;n<pool.length;n++){k=(k+1)%pool.length;if(!list.includes(pool[k])){list[j]=pool[k];break;}}
    S.swaps[b.k]=list;if(list.join()===b.ex.join())delete S.swaps[b.k];save();renderHeute();return;
  }
  if(e.target.closest('#instGo')){doInstall();return;}
  if(e.target.closest('#instNo')){S.installHide=true;save();renderHeute();return;}
  if(e.target.closest('#resetSwap')){delete S.swaps[BLOCKS[S.next%3].k];save();renderHeute();return;}
  const op=e.target.closest('[data-open]');if(op){openSheet(op.dataset.open);return;}
  if(e.target.closest('#goDaily')){const i=S.next%3;startPlayer({items:dailyItems(i),trans:trD(),type:'daily',block:BLOCKS[i].k,title:'Block '+BLOCKS[i].k+' · '+BLOCKS[i].name});}
});

function planText(){
  const tot=Math.ceil(totalSec(COMP.flatMap(p=>p.items),trC())/60);
  if(!S.startTime)return `Startzeit eintragen. Die App rechnet aus, wann du mit dem Programm beginnst (${tot} Min. + ${BUFFER_MIN} Min. Puffer für Weg und Schlitten).`;
  const [h,m]=S.startTime.split(':').map(Number);let t=h*60+m-tot-BUFFER_MIN;t=(t+1440)%1440;
  return `<b>${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')} Uhr</b>beginnen: ${tot} Min. Programm, danach ${BUFFER_MIN} Min. Puffer bis zum Start.`;
}

let delArm=null;
function renderProg(){

function fmtDate(k){const [y,m,d]=k.split('-');return `${+d}.${+m}.${y}`;}
function chartSVG(data,sample){
  const W=340,H=170,l=34,r=12,t=14,b=26;
  const vals=data.map(d=>d.cm);let mn=Math.min(0,...vals),mx=Math.max(...vals,5);
  const span=mx-mn;const step=span>40?20:span>20?10:5;mn=Math.floor(mn/step)*step;mx=Math.ceil(mx/step)*step;
  const n=data.length;
  const X=i=>n===1?(l+(W-l-r)/2):l+i*(W-l-r)/(n-1);
  const Y=v=>t+(v-mn)/(mx-mn)*(H-t-b); // invertiert: kleinere Werte (besser) oben
  let g='';
  for(let v=mn;v<=mx;v+=step){g+=`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${l-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`;}
  const zero=`<line x1="${l}" x2="${W-r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${W-r}" y="${Y(0)-5}" text-anchor="end" font-size="11" fill="var(--accent)" font-weight="600">Boden</text>`;
  const pts=data.map((d,i)=>`${X(i)},${Y(d.cm)}`).join(' ');
  const area=n>1?`<polygon points="${X(0)},${H-b} ${pts} ${X(n-1)},${H-b}" fill="var(--ink)" opacity=".06"/>`:'';
  const dots=data.map((d,i)=>`<circle cx="${X(i)}" cy="${Y(d.cm)}" r="${i===n-1?5:3.5}" fill="${i===n-1?'var(--accent)':'var(--surface)'}" stroke="${i===n-1?'var(--accent)':'var(--ink)'}" stroke-width="2"/>`).join('');
  const lastL=`<text x="${X(n-1)}" y="${Y(data[n-1].cm)-10}" text-anchor="${n>1?'end':'middle'}" font-size="12" font-weight="600" fill="var(--ink)">${data[n-1].cm} cm</text>`;
  const xl=data.map((d,i)=>(n<=6||i===0||i===n-1)?`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${fmtDate(d.date).split('.').slice(0,2).join('.')}.</text>`:'').join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf Finger-Boden-Abstand${sample?' (Beispiel)':''}" style="${sample?'opacity:.75':''}">${g}${zero}${area}${n>1?`<polyline points="${pts}" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`:''}${dots}${lastL}${xl}</svg>`;
}

}

function tick(now){
  if(!PL)return;
  const dt=Math.min(.25,(now-PL.last)/1000);PL.last=now;
  if(!PL.paused&&PL.hold>0){
    PL.hold-=dt;const f=$('#plFlash');f.hidden=false;f.textContent='Seite wechseln · '+Math.max(1,Math.ceil(PL.hold));
    if(PL.hold<=0){f.hidden=true;beep(1320,.2,.3);vib(150);}
  }else if(!PL.paused){
    PL.left-=dt;
    const it=PL.cfg.items[PL.i];
    const sec=Math.ceil(PL.left);
    if(sec<=3&&sec>=1&&!PL.beeped[PL.phase+sec]){PL.beeped[PL.phase+sec]=1;beep(880,.1,.2);vib(35);}
    if(PL.phase==='work'){
      PL.elapsed+=dt;
      if(it.sides&&!PL.side&&PL.left<=it.t/2){
        PL.side=1;PL.anim.mirror=true;beep(1320,.12);setTimeout(()=>beep(1320,.12),180);speak('Seite wechseln');vib([120,80,120]);
        showItem();if(S.switchPause>0){PL.hold=S.switchPause;}else flash('Seite wechseln');
      }
    }
    if(PL.left<=0)advance();
  }
  if(!PL)return;
  const it=PL.cfg.items[PL.i];
  const tot=PL.phase==='prep'?PL.cfg.trans:it.t;
  $('#plT').textContent=mmss(PL.left);
  $('#plBar').style.transform=`scaleX(${Math.min(1,1-PL.left/tot)})`;
  if(PL.phase==='work')$('#plProg').children[PL.i].firstChild.style.transform=`scaleX(${Math.min(1,1-PL.left/tot)})`;
  PL.anim.playing=!PL.paused;

}
function flash(txt){const f=$('#plFlash');f.textContent=txt;f.hidden=false;clearTimeout(flash.t);flash.t=setTimeout(()=>f.hidden=true,1100);}
function advance(){
  const it=PL.cfg.items[PL.i];
  if(PL.phase==='prep'){PL.phase='work';PL.left=it.t;PL.side=0;PL.beeped={};beep(1320,.25,.3);vib(200);flash('Los');showItem();return;}
  if(PL.i<PL.cfg.items.length-1){
    PL.i++;PL.phase='prep';PL.left=PL.cfg.trans;PL.beeped={};showItem();

}
function jump(d){
  const ni=PL.i+d;

<script data-app="Rodel-Mobility">
/* Gemeinsamer Kalender für alle SportGermany-Apps (v1)
 * Alle Apps liegen auf sportgermany.github.io und teilen sich deshalb denselben
 * localStorage. Termine werden unter einem gemeinsamen Schlüssel gespeichert und
 * in allen offenen Apps sofort aktualisiert. Diesen Block in jeder App identisch halten.
 * API für die Apps: window.SharedCalendar.{open, list, add, update, remove, onChange}
 */
(function () {
  "use strict";
  if (window.SharedCalendar) return;
  var KEY = "sg-shared-calendar-v1";
  var POS_KEY = "sg-shared-calendar-btn";
  var script = document.currentScript;
  var APP = (script && script.getAttribute("data-app")) || document.title || "App";
  var MON = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
  var WD = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
  var COLORS = ["#2f6fed", "#1aa179", "#e0892b", "#d64545", "#8e5bd6", "#c2418d", "#3a9fbf", "#7a8a2a"];
  var listeners = [];
  var chan = null;
  try { chan = new BroadcastChannel(KEY); } catch (e) {}

  /* ---------- Speicher ---------- */
  function load() {
    try {
      var d = JSON.parse(localStorage.getItem(KEY) || "null");
      if (d && Array.isArray(d.events)) return d;
    } catch (e) {}
    return { v: 1, events: [] };
  }
  function save(d) {
    d.updated = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(d)); }
    catch (e) { alert("Kalender konnte nicht gespeichert werden (Speicher voll?)."); return; }
    if (chan) try { chan.postMessage("changed"); } catch (e) {}
    emit();
  }
  // Jede Änderung liest zuerst den aktuellen Stand, damit keine App die Termine einer anderen überschreibt.
  function mutate(fn) { var d = load(); var r = fn(d); save(d); return r; }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function live() {
    return load().events.filter(function (e) { return !e.deleted; }).sort(function (a, b) {
      return (a.date + (a.time || "")).localeCompare(b.date + (b.time || ""));
    });
  }
  function emit() {
    var ev = live();
    listeners.forEach(function (f) { try { f(ev); } catch (e) {} });
    if (root) render();
  }
  window.addEventListener("storage", function (e) { if (e.key === KEY || e.key === null) emit(); });
  if (chan) chan.onmessage = emit;
  document.addEventListener("visibilitychange", function () { if (!document.hidden) emit(); });

  var api = {
    app: APP,
    list: function (from, to) {
      return live().filter(function (e) { return (!from || e.date >= from) && (!to || e.date <= to); });
    },
    add: function (ev) {
      return mutate(function (d) {
        var n = { id: uid(), title: String(ev.title || "Termin"), date: ev.date, time: ev.time || "", end: ev.end || "",
          note: ev.note || "", color: ev.color || "", app: ev.app || APP, created: Date.now(), changed: Date.now() };
        d.events.push(n); return n;
      });
    },
    update: function (id, patch) {
      return mutate(function (d) {
        var e = d.events.find(function (x) { return x.id === id; });
        if (!e) return null;
        Object.keys(patch).forEach(function (k) { if (k !== "id") e[k] = patch[k]; });
        e.changed = Date.now(); return e;
      });
    },
    remove: function (id) {
      // Gelöschte Termine bleiben als Markierung erhalten, damit ein Import sie nicht wiederbelebt.
      return mutate(function (d) {
        var e = d.events.find(function (x) { return x.id === id; });
        if (e) { e.deleted = true; e.changed = Date.now(); }
      });
    },
    onChange: function (f) { listeners.push(f); return function () { listeners = listeners.filter(function (x) { return x !== f; }); }; },
    open: function (date) { openPanel(date); }
  };
  window.SharedCalendar = api;

  /* ---------- Hilfen ---------- */
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parse(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function appColor(name) {
    var h = 0; for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return COLORS[h % COLORS.length];
  }
  function colorOf(e) { return e.color || appColor(e.app || ""); }
  function longDate(s) {
    var d = parse(s);
    return ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"][d.getDay()] + ", " + d.getDate() + ". " + MON[d.getMonth()] + " " + d.getFullYear();
  }
  function download(name, type, text) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: type }));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  /* ---------- Oberfläche (Shadow DOM, damit sich die Styles der Apps nicht gegenseitig stören) ---------- */
  var host, root, state = { month: null, sel: null, edit: null, filter: false };
  var CSS = [
    ":host{all:initial}",
    "*{box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}",
    ".fab{position:fixed;z-index:2147483000;width:48px;height:48px;border-radius:50%;border:0;cursor:pointer;",
    "background:#2f6fed;color:#fff;font-size:22px;box-shadow:0 4px 14px rgba(0,0,0,.3);touch-action:none;display:flex;align-items:center;justify-content:center}",
    ".fab .dot{position:absolute;top:2px;right:2px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#d64545;font-size:11px;line-height:18px;font-weight:700}",
    ".wrap{position:fixed;inset:0;z-index:2147483001;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}",
    "@media(min-width:700px){.wrap{align-items:center}}",
    ".panel{--bg:#fff;--fg:#16181d;--mut:#6b7280;--line:#e5e7eb;--soft:#f3f4f6;--acc:#2f6fed;",
    "background:var(--bg);color:var(--fg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;",
    "padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));font-size:15px;line-height:1.35}",
    "@media(min-width:700px){.panel{border-radius:18px}}",
    "@media(prefers-color-scheme:dark){.panel{--bg:#1b1d22;--fg:#eceef0;--mut:#9aa0a8;--line:#30333a;--soft:#262930}}",
    ".hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}",
    ".hd h2{flex:1;margin:0;font-size:18px}",
    "button.b{border:1px solid var(--line);background:var(--soft);color:var(--fg);border-radius:10px;padding:7px 11px;font-size:14px;cursor:pointer}",
    "button.p{background:var(--acc);border-color:var(--acc);color:#fff}",
    "button.d{color:#d64545}",
    ".grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}",
    ".wd{text-align:center;font-size:12px;color:var(--mut);padding:2px 0}",
    ".c{min-height:44px;border-radius:8px;padding:3px;cursor:pointer;background:var(--soft);border:2px solid transparent;display:flex;flex-direction:column;align-items:center}",
    ".c.o{opacity:.35}.c.t .n{background:var(--acc);color:#fff;border-radius:50%}.c.s{border-color:var(--acc)}",
    ".n{font-size:13px;width:22px;height:22px;line-height:22px;text-align:center}",
    ".ds{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;margin-top:2px}.ds i{width:6px;height:6px;border-radius:50%}",
    ".sec{margin-top:14px}.sec h3{font-size:15px;margin:0 0 8px}",
    ".ev{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:10px;background:var(--soft);margin-bottom:6px;cursor:pointer}",
    ".bar{width:4px;align-self:stretch;border-radius:2px}",
    ".ev .t{font-weight:600}.ev .m{font-size:12px;color:var(--mut)}",
    ".empty{color:var(--mut);font-size:14px;padding:6px 0}",
    "label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}",
    "input,textarea,select{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--fg);font-size:15px}",
    "textarea{min-height:70px;resize:vertical}",
    ".row{display:flex;gap:8px}.row>*{flex:1}",
    ".act{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.act .sp{flex:1}",
    ".tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}",
    ".chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);margin:8px 0 0}.chk input{width:auto}"
  ].join("");

  function mount() {
    if (host) return;
    host = document.createElement("div");
    host.id = "sg-shared-calendar";
    root = host.attachShadow({ mode: "open" });
    var st = document.createElement("style"); st.textContent = CSS; root.appendChild(st);
    var fab = document.createElement("button");
    fab.className = "fab"; fab.title = "Gemeinsamer Kalender"; fab.setAttribute("aria-label", "Gemeinsamer Kalender");
    fab.innerHTML = "📅<span class='dot' hidden></span>";
    root.appendChild(fab);
    var box = document.createElement("div"); box.className = "box"; root.appendChild(box);
    document.body.appendChild(host);
    placeFab(fab);
    dragFab(fab);
    render();
  }

  function placeFab(fab) {
    var p = null;
    try { p = JSON.parse(localStorage.getItem(POS_KEY + ":" + APP) || "null"); } catch (e) {}
    var x = p ? p.x : window.innerWidth - 60, y = p ? p.y : window.innerHeight - 140;
    fab.style.left = Math.max(4, Math.min(window.innerWidth - 52, x)) + "px";
    fab.style.top = Math.max(4, Math.min(window.innerHeight - 52, y)) + "px";
  }
  // Der Knopf lässt sich verschieben, falls er in einer App etwas verdeckt (Position wird pro App gemerkt).
  function dragFab(fab) {
    var sx, sy, ox, oy, moved = false, down = false;
    fab.addEventListener("pointerdown", function (e) {
      down = true; moved = false; sx = e.clientX; sy = e.clientY; ox = fab.offsetLeft; oy = fab.offsetTop;
      try { fab.setPointerCapture(e.pointerId); } catch (_) {}
    });
    fab.addEventListener("pointermove", function (e) {
      if (!down) return;
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (!moved && Math.abs(dx) + Math.abs(dy) < 8) return;
      moved = true;
      fab.style.left = Math.max(4, Math.min(window.innerWidth - 52, ox + dx)) + "px";
      fab.style.top = Math.max(4, Math.min(window.innerHeight - 52, oy + dy)) + "px";
    });
    fab.addEventListener("pointerup", function () {
      if (!down) return; down = false;
      if (moved) {
        try { localStorage.setItem(POS_KEY + ":" + APP, JSON.stringify({ x: fab.offsetLeft, y: fab.offsetTop })); } catch (e) {}
      } else openPanel();
    });
    fab.addEventListener("click", function (e) { if (e.detail === 0) openPanel(); }); // Tastatur
    window.addEventListener("resize", function () { placeFab(fab); });
  }

  function openPanel(date) {
    mount();
    var d = date ? parse(date) : new Date();
    state.sel = iso(d); state.month = new Date(d.getFullYear(), d.getMonth(), 1); state.edit = null; state.open = true;
    render();
  }
  function close() { state.open = false; state.edit = null; render(); }

  function render() {
    if (!root) return;
    var all = live();
    var today = iso(new Date());
    var dot = root.querySelector(".fab .dot");
    var n = all.filter(function (e) { return e.date === today; }).length;
    dot.hidden = !n; dot.textContent = n;
    var box = root.querySelector(".box");
    if (!state.open) { box.innerHTML = ""; return; }
    var evs = state.filter ? all.filter(function (e) { return e.app === APP; }) : all;
    var h = "<div class='wrap'><div class='panel' role='dialog' aria-label='Gemeinsamer Kalender'>";
    h += state.edit ? form(state.edit) : month(evs, today);
    h += "</div></div>";
    box.innerHTML = h;
    bind(box);
  }

  function month(evs, today) {
    var m = state.month, y = m.getFullYear(), mo = m.getMonth();
    var byDay = {};
    evs.forEach(function (e) { (byDay[e.date] = byDay[e.date] || []).push(e); });
    var h = "<div class='hd'><button class='b' data-a='prev' aria-label='Voriger Monat'>‹</button><h2>" + MON[mo] + " " + y +
      "</h2><button class='b' data-a='next' aria-label='Nächster Monat'>›</button><button class='b' data-a='today'>Heute</button><button class='b' data-a='close' aria-label='Schließen'>✕</button></div>";
    h += "<div class='grid'>" + WD.map(function (w) { return "<div class='wd'>" + w + "</div>"; }).join("");
    var start = new Date(y, mo, 1 - ((m.getDay() + 6) % 7));
    for (var i = 0; i < 42; i++) {
      var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i), k = iso(d);
      if (i === 35 && d.getMonth() !== mo) break;
      var cls = "c" + (d.getMonth() !== mo ? " o" : "") + (k === today ? " t" : "") + (k === state.sel ? " s" : "");
      var dots = (byDay[k] || []).slice(0, 4).map(function (e) { return "<i style='background:" + colorOf(e) + "'></i>"; }).join("");
      h += "<div class='" + cls + "' data-day='" + k + "'><span class='n'>" + d.getDate() + "</span><span class='ds'>" + dots + "</span></div>";
    }
    h += "</div>";
    h += "<label class='chk'><input type='checkbox' data-a='filter'" + (state.filter ? " checked" : "") + "> Nur Termine aus „" + esc(APP) + "“ zeigen</label>";
    var list = byDay[state.sel] || [];
    h += "<div class='sec'><div class='hd'><h3 style='flex:1;margin:0'>" + longDate(state.sel) + "</h3><button class='b p' data-a='new'>+ Termin</button></div>";
    h += list.length ? list.map(item).join("") : "<div class='empty'>Keine Termine an diesem Tag.</div>";
    h += "</div>";
    var upcoming = evs.filter(function (e) { return e.date > state.sel; }).slice(0, 5);
    if (upcoming.length) h += "<div class='sec'><h3>Danach</h3>" + upcoming.map(function (e) { return item(e, true); }).join("") + "</div>";
    h += "<div class='tools'><button class='b' data-a='export'>Sichern</button><button class='b' data-a='import'>Importieren</button><button class='b' data-a='ics'>Als .ics exportieren</button></div>";
    return h;
  }

  function item(e, withDate) {
    var meta = [];
    if (withDate) meta.push(parse(e.date).getDate() + ". " + MON[parse(e.date).getMonth()]);
    if (e.time) meta.push(e.time + (e.end ? "–" + e.end : "") + " Uhr");
    meta.push(e.app);
    return "<div class='ev' data-id='" + esc(e.id) + "'><span class='bar' style='background:" + colorOf(e) + "'></span><div><div class='t'>" + esc(e.title) +
      "</div><div class='m'>" + esc(meta.join(" · ")) + "</div>" + (e.note ? "<div class='m'>" + esc(e.note) + "</div>" : "") + "</div></div>";
  }

  function form(e) {
    var isNew = !e.id;
    var h = "<div class='hd'><h2>" + (isNew ? "Neuer Termin" : "Termin bearbeiten") + "</h2><button class='b' data-a='back' aria-label='Zurück'>✕</button></div>";
    h += "<label>Titel</label><input name='title' maxlength='120' value='" + esc(e.title || "") + "' placeholder='z. B. Training, Klassenarbeit …'>";
    h += "<label>Datum</label><input type='date' name='date' value='" + esc(e.date) + "'>";
    h += "<div class='row'><div><label>Von (optional)</label><input type='time' name='time' value='" + esc(e.time || "") + "'></div>" +
      "<div><label>Bis (optional)</label><input type='time' name='end' value='" + esc(e.end || "") + "'></div></div>";
    h += "<label>Notiz</label><textarea name='note' maxlength='1000'>" + esc(e.note || "") + "</textarea>";
    h += "<label>Farbe</label><select name='color'><option value=''>Farbe der App</option>" +
      COLORS.map(function (c, i) { return "<option value='" + c + "'" + (e.color === c ? " selected" : "") + ">" + ["Blau", "Grün", "Orange", "Rot", "Lila", "Pink", "Türkis", "Oliv"][i] + "</option>"; }).join("") + "</select>";
    if (!isNew) h += "<div class='m' style='margin-top:10px;font-size:12px;color:var(--mut)'>Angelegt in „" + esc(e.app) + "“</div>";
    h += "<div class='act'>" + (isNew ? "" : "<button class='b d' data-a='del'>Löschen</button>") + "<span class='sp'></span><button class='b' data-a='back'>Abbrechen</button><button class='b p' data-a='save'>Speichern</button></div>";
    return h;
  }

  function bind(box) {
    box.querySelector(".wrap").addEventListener("click", function (ev) {
      if (ev.target.classList.contains("wrap")) { close(); return; }
      var t = ev.target.closest("[data-a],[data-day],[data-id]");
      if (!t) return;
      if (t.dataset.day) { state.sel = t.dataset.day; render(); return; }
      if (t.dataset.id && !t.dataset.a) {
        var e = live().find(function (x) { return x.id === t.dataset.id; });
        if (e) { state.edit = Object.assign({}, e); render(); }
        return;
      }
      act(t.dataset.a, box);
    });
    var f = box.querySelector("[data-a=filter]");
    if (f) f.addEventListener("change", function () { state.filter = f.checked; render(); });
    var ti = box.querySelector("input[name=title]");
    if (ti && !state.edit.id) ti.focus();
  }

  function act(a, box) {
    var m = state.month;
    if (a === "prev") state.month = new Date(m.getFullYear(), m.getMonth() - 1, 1);
    else if (a === "next") state.month = new Date(m.getFullYear(), m.getMonth() + 1, 1);
    else if (a === "today") { var t = new Date(); state.sel = iso(t); state.month = new Date(t.getFullYear(), t.getMonth(), 1); }
    else if (a === "close") return close();
    else if (a === "new") state.edit = { date: state.sel, app: APP };
    else if (a === "back") state.edit = null;
    else if (a === "save") {
      var v = {};
      ["title", "date", "time", "end", "note", "color"].forEach(function (k) { v[k] = box.querySelector("[name=" + k + "]").value.trim(); });
      if (!v.title) { box.querySelector("[name=title]").focus(); return; }
      if (!/^\d{4}-\d{2}-\d{2}$/.test(v.date)) { box.querySelector("[name=date]").focus(); return; }
      if (state.edit.id) api.update(state.edit.id, v); else api.add(v);
      state.sel = v.date; var d = parse(v.date); state.month = new Date(d.getFullYear(), d.getMonth(), 1);
      state.edit = null;
    }
    else if (a === "del") {
      if (!confirm("Termin „" + state.edit.title + "“ in allen Apps löschen?")) return;
      api.remove(state.edit.id); state.edit = null;
    }
    else if (a === "export") return download("gemeinsamer-kalender-" + iso(new Date()) + ".json", "application/json", JSON.stringify(load(), null, 2));
    else if (a === "import") return importFile();
    else if (a === "ics") return download("gemeinsamer-kalender.ics", "text/calendar", ics());
    render();
  }

  // Import führt zusammen: pro Termin gewinnt die zuletzt geänderte Fassung, nichts wird blind überschrieben.
  function importFile() {
    var inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".json,application/json";
    inp.onchange = function () {
      var file = inp.files && inp.files[0]; if (!file) return;
      file.text().then(function (txt) {
        var src = JSON.parse(txt);
        if (!src || !Array.isArray(src.events)) throw new Error("format");
        var added = 0;
        mutate(function (d) {
          src.events.forEach(function (e) {
            if (!e || !e.id || !/^\d{4}-\d{2}-\d{2}$/.test(e.date)) return;
            var i = d.events.findIndex(function (x) { return x.id === e.id; });
            if (i < 0) { d.events.push(e); added++; }
            else if ((e.changed || 0) > (d.events[i].changed || 0)) d.events[i] = e;
          });
        });
        alert("Import fertig: " + added + " neue Termine.");
      }).catch(function () { alert("Diese Datei ist keine gültige Kalender-Sicherung."); });
    };
    inp.click();
  }

  function ics() {
    function f(s) { return String(s).replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/[,;]/g, "\\$&"); }
    function stamp(date, time) { return date.replace(/-/g, "") + "T" + time.replace(":", "") + "00"; }
    var out = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//SportGermany//Gemeinsamer Kalender//DE"];
    live().forEach(function (e) {
      out.push("BEGIN:VEVENT", "UID:" + e.id + "@sportgermany", "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z");
      if (e.time) {
        out.push("DTSTART:" + stamp(e.date, e.time));
        if (e.end) out.push("DTEND:" + stamp(e.date, e.end));
      } else {
        var n = parse(e.date); n.setDate(n.getDate() + 1);
        out.push("DTSTART;VALUE=DATE:" + e.date.replace(/-/g, ""), "DTEND;VALUE=DATE:" + iso(n).replace(/-/g, ""));
      }
      out.push("SUMMARY:" + f(e.title), "DESCRIPTION:" + f((e.note ? e.note + "\n" : "") + "aus " + e.app), "END:VEVENT");
    });
    out.push("END:VCALENDAR");
    return out.join("\r\n");
  }

  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && state.open) close(); });
  if (document.body) mount(); else document.addEventListener("DOMContentLoaded", mount);
})();
</script>
<!-- gemeinsamer-kalender:end -->
</body>
</html>
